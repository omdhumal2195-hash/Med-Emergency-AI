{% extends "base.html" %}{% block title %}Register{% endblock %}{% block content %}
<div class="form-card mx-auto"><h2>Create Patient Account</h2><p class="text-muted">Start your Med-Emergency profile.</p>
<form method="post">
 <label class="form-label">Full name</label><input class="form-control mb-3" name="name" required>
 <label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>
 <label class="form-label">Password (minimum 8 characters)</label><input class="form-control mb-3" type="password" name="password" minlength="8" required>
 <button class="btn btn-primary w-100">Create Account</button>
</form><p class="mt-3 mb-0">Already registered? <a href="{{ url_for('login') }}">Login</a></p></div>
{% endblock %}
